<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — ORVEX</title>
<meta name="description" content="Entre na sua conta ORVEX." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--bg-soft:#F7F7F8;--surface-solid:#FFFFFF;
  --text:#0B0B0C;--text-2:#55555C;--text-3:#8B8B93;
  --line:rgba(11,11,12,.08);--line-2:rgba(11,11,12,.15);--line-3:rgba(11,11,12,.26);
  --err:#C4453B;
  --shadow-m:0 1px 2px rgba(11,11,12,.04), 0 10px 28px -16px rgba(11,11,12,.16);
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --bg:#0B0B0C;--bg-soft:#111113;--surface-solid:#141416;
  --text:#F4F4F5;--text-2:#A2A2AA;--text-3:#70707A;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);--line-3:rgba(255,255,255,.30);
  --err:#E88A80;
  --shadow-m:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -20px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;
  transition:background .5s var(--ease),color .5s var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.small{font-size:13.5px;color:var(--text-3);line-height:1.6}
h1{margin:0;font-weight:500;letter-spacing:-.032em;line-height:1.06;font-size:clamp(30px,6vw,52px)}
.lead{font-size:clamp(15px,1.4vw,18px);line-height:1.6;color:var(--text-2);margin:14px 0 0;max-width:460px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;
  border-radius:999px;font-size:14px;font-weight:500;letter-spacing:-.01em;border:1px solid transparent;
  transition:transform .35s var(--ease),box-shadow .4s,background .3s}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--text);color:var(--bg);box-shadow:var(--shadow-m)}
.btn-dark:hover{transform:translateY(-1px)}
.arrow{transition:transform .35s var(--ease)}
.btn:hover .arrow{transform:translateX(3px)}
header{position:fixed;top:0;left:0;right:0;z-index:80}
.nav{max-width:1180px;margin:0 auto;padding:0 30px;display:flex;align-items:center;height:52px}
.brand{font-weight:500;letter-spacing:-.02em;font-size:15.5px;display:flex;align-items:center;gap:9px}
.brand-image{width:146px;height:auto;display:block}
[data-theme="dark"] .brand-image{filter:invert(1)}
.auth{max-width:1180px;margin:0 auto;padding:132px 30px 80px}
.card{margin-top:38px;max-width:420px;background:var(--surface-solid);border:1px solid var(--line);
  border-radius:20px;padding:26px;box-shadow:var(--shadow-m)}
.field{display:block;margin-bottom:16px}
.field span{display:block;color:var(--text-3);margin-bottom:7px}
.field input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none;transition:border-color .25s}
.field input:focus{border-color:var(--line-3)}
.err{min-height:20px;margin:0 0 10px;font-size:13.5px;color:var(--err)}
.card .btn{width:100%}
.alt{margin:16px 0 0;text-align:center}
.alt a{border-bottom:1px solid var(--line-3)}
@media(max-width:680px){
  .nav{padding:0 18px;height:46px}.brand-image{width:128px}
  .auth{padding:104px 18px 64px}
  .card{padding:20px}
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="index.html" class="brand" aria-label="ORVEX — início">
      <img class="brand-image" src="attached_assets/orvex-logo-transparent.png" alt="ORVEX" />
    </a>
  </div>
</header>

<main class="auth">
  <h1>Bem-vindo de volta.</h1>
  <p class="lead">Entre para acessar a plataforma ORVEX.</p>

  <form class="card" id="form" novalidate>
    <label class="field">
      <span class="mono">Email</span>
      <input id="email" type="email" autocomplete="email" placeholder="voce@empresa.com" required />
    </label>
    <label class="field">
      <span class="mono">Senha</span>
      <input id="pass" type="password" autocomplete="current-password" required />
    </label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn btn-dark" type="submit">Entrar <span class="arrow">→</span></button>
    <p class="alt small">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </form>
</main>

<script>
(function(){
  'use strict';
  try {
    var saved = localStorage.getItem('orvex-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');
  } catch(e){}

  var form = document.getElementById('form');
  var email = document.getElementById('email');
  var pass = document.getElementById('pass');
  var err = document.getElementById('err');

  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return b.toString(16).padStart(2,'0');
      }).join('');
    });
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    err.textContent = '';
    var mail = email.value.trim().toLowerCase();
    var pwd = pass.value;
    if (!mail || !pwd) { err.textContent = 'Preencha e-mail e senha.'; return; }

    var acct = null;
    try { acct = (JSON.parse(localStorage.getItem('orvex-accounts')) || {})[mail]; } catch(e){}
    if (!acct) { err.textContent = 'E-mail ou senha incorretos.'; return; }

    sha256(acct.salt + ':' + pwd).then(function(hash){
      if (hash !== acct.hash) { err.textContent = 'E-mail ou senha incorretos.'; return; }
      localStorage.setItem('orvex-session', mail);
      location.href = 'dashboard.html';
    }).catch(function(){ err.textContent = 'Não foi possível entrar neste navegador.'; });
  });
})();
</script>
</body>
</html>
